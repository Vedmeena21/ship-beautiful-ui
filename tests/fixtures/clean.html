<!doctype html>
<html lang="en"><head><style>
  :root{--base:#F7F7F3;--ink:#141414;--accent:#B3261E;--font-display:"Instrument Serif",serif;--font-body:"Instrument Sans",sans-serif}
  body{font-family:var(--font-body);background:var(--base);color:var(--ink);font-size:17px}
  h1{font-family:var(--font-display);font-size:64px}
  .btn{border-radius:6px;transition:transform .18s ease-out, opacity .18s ease-out}
  .panel{border-radius:12px}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important}}
</style></head><body>
<h1>Send your first invoice before the film is dry</h1>
<p>Built for freelance photographers. Add a client, attach the shoot, send.</p>
<img src="contact-sheet.jpg" alt="Contact sheet from a wedding shoot">
<a class="btn" href="/start">Send an invoice</a>
</body></html>
